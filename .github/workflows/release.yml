name: 📦 Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0 or 1.0.0-beta1). Use "auto" to read from CHANGELOG.md'
        required: true
        type: string
        default: 'auto'
      create_tag:
        description: 'Create git tag for the release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as prerelease (for beta/alpha versions)'
        required: false
        type: boolean
        default: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [[ -z "$VERSION" || "$VERSION" == "auto" ]]; then
          if [ -f CHANGELOG.md ]; then
            VERSION=$(awk '/^## \[/{gsub(/\[|\]/, "", $2); print $2; exit}' CHANGELOG.md)
            echo "ℹ️ Auto-detected version from CHANGELOG.md: $VERSION"
          else
            echo "❌ No CHANGELOG.md found and no version specified"
            exit 1
          fi
        fi

        TAG_NAME="v$VERSION"

        if [[ "$VERSION" =~ (alpha|beta|rc|dev|pre) ]]; then
          IS_PRERELEASE="true"
        else
          IS_PRERELEASE="false"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

  package-addon:
    name: Package Addon (BigWigs Packager + .pkgmeta)
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create local tag for packager
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        TAG_NAME="v$VERSION"
        if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          git tag -a "$TAG_NAME" -m "Release version $VERSION"
        fi

    - name: Package with BigWigs Packager (downloads externals from .pkgmeta)
      uses: BigWigsMods/packager@v2
      env:
        CF_API_KEY: ${{ needs.validate-release.outputs.is_prerelease == 'true' && '' || secrets.CF_API_KEY }}
        WAGO_API_TOKEN: ${{ needs.validate-release.outputs.is_prerelease == 'true' && '' || secrets.WAGO_API_TOKEN }}
        WOWI_API_TOKEN: ${{ needs.validate-release.outputs.is_prerelease == 'true' && '' || secrets.WOWI_API_TOKEN }}
        GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Multi-Version ZIPs to GitHub Release (Wago / CurseForge naming)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        TAG_NAME="v$VERSION"
        BASE_ZIP=".release/GathererReforged-${TAG_NAME}.zip"
        if [ ! -f "$BASE_ZIP" ]; then
          BASE_ZIP=$(ls .release/GathererReforged-*.zip | grep -v "\-nolib" | head -n 1)
        fi
        if [ -n "$BASE_ZIP" ] && [ -f "$BASE_ZIP" ]; then
          for SUFFIX in "-mists" "-cata" "-wrath" "-bcc" "-forever" "-classic"; do
            TARGET_ZIP=".release/GathererReforged-${TAG_NAME}${SUFFIX}.zip"
            if [ ! -f "$TARGET_ZIP" ]; then
              cp "$BASE_ZIP" "$TARGET_ZIP"
              gh release upload "$TAG_NAME" "$TARGET_ZIP" --clobber || true
            fi
          done
        fi

