name: Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  luacheck:
    name: Lua Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Lua and luacheck
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 luarocks
        sudo luarocks install luacheck

    - name: Run luacheck
      run: |
        echo "Running luacheck..."
        luacheck --no-color --codes Core/ Data/ GUI/ Locales/ || true

  toc-validation:
    name: TOC Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate TOC files
      run: |
        for toc in GathererReborn.toc; do
          if [ -f "$toc" ]; then
            echo "✅ TOC file found: $toc"
          else
            echo "❌ TOC file missing: $toc"
            exit 1
          fi
        done

