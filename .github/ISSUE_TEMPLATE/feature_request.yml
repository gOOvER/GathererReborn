name: ✨ Feature / Integration Request
description: Suggest a new feature, UI improvement, or third-party addon integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **Gatherer Reforged** even better, or want integration with another WoW addon? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: A clear and concise description of the problem or farming workflow this feature would improve.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Reference Addons
      description: Any alternative solutions or existing addons you'd like us to support or bridge with.
    validations:
      required: false

